<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-Time YOLOv8 Detection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="/static/R.png" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.js"></script>
  </head>
  <body class="bg-gray-100">
    <!-- Navbar -->
    <nav class="bg-[#5C9EBD] text-white p-6 shadow-md w-full fixed top-0 z-50">
      <div class="container mx-auto flex items-center justify-between">
        <a href="/" class="text-xl font-bold">Real-Time YOLOv8 Detection</a>
        <div
          class="absolute left-1/2 transform -translate-x-1/2 flex space-x-4"
        >
          <a href="/" class="hover:text-gray-200 text-lg font-medium"
            >Upload Video</a
          >
          <span>|</span>
          <a href="/url" class="hover:text-gray-200 text-lg font-medium"
            >Upload URL</a
          >
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="p-6 bg-white shadow-lg pt-24">
      <h1 class="text-2xl font-bold text-center mb-6">
        Real-Time YOLOv8 Detection - Upload URL
      </h1>
      <div class="mb-6">
        <label for="streamingUrl" class="block font-semibold"
          >Enter URL Streaming:</label
        >
        <input
          type="text"
          id="streamingUrl"
          class="w-full border border-gray-300 rounded-lg p-2 mt-2"
          placeholder="Enter Live URL"
        />
        <button
          class="mt-3 bg-[#5C9EBD] text-white px-4 py-2 rounded-lg hover:bg-blue-600"
          onclick="detectFromURL()"
        >
          Detect from URL
        </button>
      </div>

      <!-- Video Frame -->
      <div class="mb-6 flex justify-center">
        <img
          id="videoFrame"
          width="640"
          height="480"
          class="border-2 border-black"
        />
      </div>

      <!-- Detection Logs -->
      <h2 class="text-xl font-semibold mt-4">Detection Logs</h2>
      <div class="overflow-x-auto">
        <table class="w-full border border-gray-300 mt-3 text-center">
          <thead>
            <tr class="bg-gray-200">
              <th class="border px-4 py-2">Frame Time</th>
              <th class="border px-4 py-2">Frame Number</th>
              <th class="border px-4 py-2">Object Name</th>
              <th class="border px-4 py-2">Confidence</th>
              <th class="border px-4 py-2">Gambar</th>
            </tr>
          </thead>
          <tbody id="detectionLogs"></tbody>
        </table>
      </div>
    </div>

    <!-- Toast Notification -->
    <div
      id="violationToast"
      class="hidden fixed bottom-4 right-4 bg-red-500 text-white p-4 rounded-lg shadow-lg"
    >
      <span id="violationMessage"></span>
      <button
        onclick="hideToast()"
        class="ml-4 bg-white text-red-500 px-2 py-1 rounded"
      >
        Close
      </button>
    </div>

    <!-- Image Modal -->
    <div
      id="imageModal"
      class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden"
    >
      <div class="bg-white p-4 rounded-lg shadow-lg">
        <img id="modalImage" src="" class="max-w-full max-h-screen" />
        <button
          onclick="closeImageModal()"
          class="mt-4 bg-red-500 text-white px-4 py-2 rounded"
        >
          Close
        </button>
      </div>
    </div>

    <script>
      const socket = io.connect("http://localhost:5000");

      function detectFromURL() {
        const stream_url = document.getElementById("streamingUrl").value;
        fetch("http://localhost:5000/detect_from_stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ stream_url }),
        })
          .then((response) => response.json())
          .then((data) => {
            alert(
              data.stream_url
                ? "Processing stream: " + data.stream_url
                : "Failed to process the stream!"
            );
          })
          .catch((error) => console.error("Error:", error));
      }

      // Listen to video frames from server
      socket.on("video_frame", (data) => {
        document.getElementById(
          "videoFrame"
        ).src = `data:image/jpeg;base64,${data.frame}`;
      });

      // Add detection log
      function addDetectionLog(data) {
        const table = document.getElementById("detectionLogs");
        const row = table.insertRow();
        row.insertCell(0).textContent = data.frame_time || "N/A";
        row.insertCell(1).textContent = data.frame_number || "N/A";
        row.insertCell(2).textContent = data.object_name || "Unknown";
        row.insertCell(3).textContent = data.confidence
          ? data.confidence.toFixed(2)
          : "N/A";
        const imgCell = row.insertCell(4);
        if (data.image_path) {
          const img = document.createElement("img");
          img.src = `http://localhost:5000/${data.image_path}`;
          img.width = 100;
          img.height = 80;
          img.classList.add("cursor-pointer");
          img.onclick = () => openImageModal(img.src);
          imgCell.appendChild(img);
        } else {
          imgCell.textContent = "No Image";
        }
      }

      // Open image modal for larger view
      function openImageModal(imageSrc) {
        document.getElementById("modalImage").src = imageSrc;
        document.getElementById("imageModal").classList.remove("hidden");
      }

      // Close image modal
      function closeImageModal() {
        document.getElementById("imageModal").classList.add("hidden");
      }

      // Listen to detection logs
      socket.on("detection_log", (data) => {
        addDetectionLog(data);
      });

      // Show violation alert
      socket.on("violation_alert", (data) => {
        document.getElementById(
          "violationMessage"
        ).textContent = `Pelanggaran terdeteksi: ${data.message} pada frame ke-${data.frame_number}`;
        document.getElementById("violationToast").classList.remove("hidden");

        // Add violation log to the table
        addDetectionLog({
          frame_time: data.frame_time,
          frame_number: data.frame_number,
          object_name: data.object_name,
          confidence: data.confidence,
          image_path: data.image_path,
        });
      });

      // Hide toast notification
      function hideToast() {
        document.getElementById("violationToast").classList.add("hidden");
      }
    </script>
  </body>
</html>
