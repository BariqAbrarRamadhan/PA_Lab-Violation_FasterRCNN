<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-Time Faster R-CNN Detection - Upload Video</title>
    <style>
      /* Modern CSS Variables */
      :root {
        --primary-color: #2563eb;
        --primary-hover: #1d4ed8;
        --primary-light: #dbeafe;
        --secondary-color: #64748b;
        --success-color: #10b981;
        --danger-color: #ef4444;
        --background: #f8fafc;
        --surface: #ffffff;
        --border-color: #e2e8f0;
        --text-primary: #0f172a;
        --text-secondary: #64748b;
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1),
          0 2px 4px -2px rgb(0 0 0 / 0.1);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1),
          0 4px 6px -4px rgb(0 0 0 / 0.1);
        --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1),
          0 8px 10px -6px rgb(0 0 0 / 0.1);
        --radius-sm: 0.375rem;
        --radius-md: 0.5rem;
        --radius-lg: 0.75rem;
        --radius-xl: 1rem;
      }

      /* Reset & Base Styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 2rem;
        color: var(--text-primary);
        line-height: 1.6;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        background: var(--surface);
        border-radius: 0 0 16px 16px;
        box-shadow: var(--shadow-xl);
        overflow: hidden;
      }

      /* Header Styles */
      .header {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 16px 16px 0 0;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: white;
        padding: 2rem 2.5rem;
      }

      .header h1 {
        font-size: 1.875rem;
        font-weight: 700;
        margin-bottom: 1.5rem;
        letter-spacing: -0.025em;
      }

      .nav-tabs {
        display: flex;
        gap: 0.5rem;
        background: rgba(255, 255, 255, 0.1);
        padding: 0.375rem;
        border-radius: var(--radius-lg);
        backdrop-filter: blur(10px);
      }

      .nav-tab {
        flex: 1;
        padding: 0.75rem 1.5rem;
        text-align: center;
        text-decoration: none;
        color: rgba(255, 255, 255, 0.8);
        border-radius: var(--radius-md);
        font-weight: 500;
        transition: all 0.3s ease;
        position: relative;
      }

      .nav-tab:hover {
        color: white;
        background: rgba(255, 255, 255, 0.1);
      }

      .nav-tab.active {
        background: white;
        color: var(--primary-color);
        box-shadow: var(--shadow-md);
      }

      /* Main Content */
      .main-content {
        padding: 2.5rem;
      }

      .upload-section {
        margin-bottom: 2.5rem;
      }

      .upload-section h2 {
        font-size: 1.5rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 1.5rem;
      }

      /* Upload Area - Video */
      .upload-area {
        border: 2px dashed var(--border-color);
        border-radius: var(--radius-lg);
        padding: 3rem 2rem;
        text-align: center;
        background: var(--background);
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .upload-area:hover {
        border-color: var(--primary-color);
        background: var(--primary-light);
      }

      .upload-label {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        cursor: pointer;
      }

      .upload-icon {
        width: 4rem;
        height: 4rem;
        color: var(--primary-color);
        stroke-width: 1.5;
      }

      .upload-text {
        font-size: 1.125rem;
        font-weight: 500;
        color: var(--text-primary);
      }

      .upload-subtext {
        font-size: 0.875rem;
        color: var(--text-secondary);
      }

      /* File Info */
      .file-info {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem 1.5rem;
        background: var(--primary-light);
        border: 1px solid var(--primary-color);
        border-radius: var(--radius-md);
        margin-top: 1rem;
      }

      .file-name {
        font-weight: 500;
        color: var(--primary-color);
      }

      .remove-btn {
        background: transparent;
        border: none;
        color: var(--danger-color);
        font-size: 1.5rem;
        cursor: pointer;
        padding: 0.25rem 0.5rem;
        border-radius: var(--radius-sm);
        transition: all 0.2s ease;
      }

      .remove-btn:hover {
        background: var(--danger-color);
        color: white;
      }

      /* URL Input - URL Page */
      .url-input-container {
        margin-bottom: 1.5rem;
      }

      .input-label {
        display: block;
        font-weight: 500;
        color: var(--text-primary);
        margin-bottom: 0.5rem;
      }

      .input-group {
        display: flex;
        gap: 0.5rem;
      }

      .url-input {
        flex: 1;
        padding: 0.875rem 1.25rem;
        border: 2px solid var(--border-color);
        border-radius: var(--radius-md);
        font-size: 1rem;
        transition: all 0.3s ease;
        background: var(--surface);
      }

      .url-input:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px var(--primary-light);
      }

      .paste-btn {
        padding: 0.875rem 1rem;
        background: var(--background);
        border: 2px solid var(--border-color);
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .paste-btn:hover {
        background: var(--primary-color);
        border-color: var(--primary-color);
      }

      .paste-btn:hover svg {
        stroke: white;
      }

      .paste-btn svg {
        width: 1.5rem;
        height: 1.5rem;
        stroke: var(--text-secondary);
        transition: all 0.3s ease;
      }

      .input-hint {
        font-size: 0.875rem;
        color: var(--text-secondary);
        margin-top: 0.5rem;
      }

      /* Upload Button */
      .upload-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.875rem 2rem;
        background: linear-gradient(
          135deg,
          var(--primary-color) 0%,
          #1e40af 100%
        );
        color: white;
        border: none;
        border-radius: var(--radius-md);
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: var(--shadow-md);
        margin-top: 1.5rem;
      }

      .upload-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: var(--shadow-lg);
      }

      .upload-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-icon {
        width: 1.25rem;
        height: 1.25rem;
        stroke-width: 2;
      }

      /* Video Display */
      .video-display {
        margin-bottom: 2.5rem;
      }

      .video-container {
        border-radius: var(--radius-lg);
        overflow: hidden;
        background: var(--background);
        box-shadow: var(--shadow-md);
      }

      .video-placeholder {
        aspect-ratio: 16/9;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: linear-gradient(135deg, var(--background) 0%, #e2e8f0 100%);
        color: var(--text-secondary);
      }

      .video-placeholder svg {
        width: 5rem;
        height: 5rem;
        stroke-width: 1.5;
        opacity: 0.5;
      }

      .video-placeholder p {
        font-size: 1.125rem;
        font-weight: 500;
      }

      /* Detection Logs */
      .detection-logs h3 {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 1rem;
        color: var(--text-primary);
      }

      .logs-table-wrapper {
        border-radius: var(--radius-lg);
        overflow: hidden;
        box-shadow: var(--shadow-md);
        border: 1px solid var(--border-color);
      }

      .logs-table {
        width: 100%;
        border-collapse: collapse;
        background: var(--surface);
      }

      .logs-table thead {
        background: var(--background);
      }

      .logs-table th {
        padding: 1rem 1.5rem;
        text-align: left;
        font-weight: 600;
        font-size: 0.875rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-secondary);
        border-bottom: 2px solid var(--border-color);
      }

      .logs-table tbody tr {
        border-bottom: 1px solid var(--border-color);
        transition: all 0.2s ease;
      }

      .logs-table tbody tr:hover:not(.empty-state) {
        background: var(--background);
      }

      .logs-table tbody tr:last-child {
        border-bottom: none;
      }

      .logs-table td {
        padding: 1rem 1.5rem;
        color: var(--text-primary);
      }

      .empty-state td {
        text-align: center;
        padding: 3rem 1.5rem;
        color: var(--text-secondary);
        font-style: italic;
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        body {
          padding: 1rem;
        }

        .header {
          padding: 1.5rem;
        }

        .header h1 {
          font-size: 1.5rem;
        }

        .main-content {
          padding: 1.5rem;
        }

        .nav-tabs {
          flex-direction: column;
        }

        .upload-area {
          padding: 2rem 1rem;
        }

        .upload-icon {
          width: 3rem;
          height: 3rem;
        }

        .logs-table-wrapper {
          overflow-x: auto;
        }

        .logs-table {
          min-width: 600px;
        }
      }

      /* Animations */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .upload-section,
      .video-display,
      .detection-logs {
        animation: fadeIn 0.5s ease-out;
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <h1>Real-Time Faster R-CNN Detection</h1>
      <nav class="nav-tabs">
        <a href="upload_video.html" class="nav-tab active">Upload Video</a>
        <a href="upload_url.html" class="nav-tab">Upload URL</a>
      </nav>
    </header>
    <div class="container">
      <!-- Main Content -->
      <main class="main-content">
        <section class="upload-section">
          <h2>Real-Time Faster R-CNN Detection Upload Video</h2>

          <div class="upload-area">
            <label for="video-upload" class="upload-label">
              <svg
                class="upload-icon"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
                />
              </svg>
              <span class="upload-text"
                >Klik atau seret file video di sini</span
              >
              <span class="upload-subtext"
                >Format: MP4, AVI, MOV (Maks. 100MB)</span
              >
            </label>
            <input type="file" id="video-upload" accept="video/*" hidden />
          </div>

          <div class="file-info" id="file-info" style="display: none">
            <span class="file-name" id="file-name"></span>
            <button class="remove-btn" id="remove-btn">✕</button>
          </div>

          <button class="upload-btn" id="upload-btn" disabled>
            <svg
              class="btn-icon"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"
              />
            </svg>
            Upload & Detect
          </button>
        </section>

        <!-- Video Display Area -->
        <section class="video-display">
          <div class="video-container">
            <div class="video-placeholder">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"
                />
              </svg>
              <p>Preview video akan muncul di sini</p>
            </div>
          </div>
        </section>

        <!-- Detection Logs -->
        <section class="detection-logs">
          <h3>Detection Logs</h3>
          <div class="logs-table-wrapper">
            <table class="logs-table">
              <thead>
                <tr>
                  <th>Frame Time</th>
                  <th>Frame Number</th>
                  <th>Object Name</th>
                  <th>Confidence</th>
                  <th>Timestamp</th>
                </tr>
              </thead>
              <tbody>
                <tr class="empty-state">
                  <td colspan="5">
                    Belum ada deteksi. Upload video untuk memulai.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script>
      // Upload Video Page
      const videoUpload = document.getElementById("video-upload");
      const uploadBtn = document.getElementById("upload-btn");
      const fileInfo = document.getElementById("file-info");
      const fileName = document.getElementById("file-name");
      const removeBtn = document.getElementById("remove-btn");

      if (videoUpload) {
        videoUpload.addEventListener("change", (e) => {
          const file = e.target.files[0];
          if (file) {
            fileName.textContent = file.name;
            fileInfo.style.display = "flex";
            uploadBtn.disabled = false;
          }
        });
      }

      if (removeBtn) {
        removeBtn.addEventListener("click", () => {
          videoUpload.value = "";
          fileInfo.style.display = "none";
          uploadBtn.disabled = true;
        });
      }

      if (uploadBtn) {
        uploadBtn.addEventListener("click", () => {
          alert("Upload functionality will be implemented here!");
          // Add your upload logic here
        });
      }

      // Drag and drop functionality for upload area
      const uploadArea = document.querySelector(".upload-area");

      if (uploadArea) {
        uploadArea.addEventListener("dragover", (e) => {
          e.preventDefault();
          uploadArea.style.borderColor = "var(--primary-color)";
          uploadArea.style.background = "var(--primary-light)";
        });

        uploadArea.addEventListener("dragleave", () => {
          uploadArea.style.borderColor = "var(--border-color)";
          uploadArea.style.background = "var(--background)";
        });

        uploadArea.addEventListener("drop", (e) => {
          e.preventDefault();
          uploadArea.style.borderColor = "var(--border-color)";
          uploadArea.style.background = "var(--background)";

          const files = e.dataTransfer.files;
          if (files.length > 0 && files[0].type.startsWith("video/")) {
            videoUpload.files = files;
            fileName.textContent = files[0].name;
            fileInfo.style.display = "flex";
            uploadBtn.disabled = false;
          }
        });
      }
    </script>
  </body>
</html>
